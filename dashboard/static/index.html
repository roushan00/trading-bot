<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5">
    <title>Trading Bot Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f1117; color: #e1e1e6; padding: 20px; }
        h1 { color: #00d4aa; margin-bottom: 5px; }
        .subtitle { color: #888; margin-bottom: 20px; font-size: 14px; }
        .mode-badge { background: #1a3a2a; color: #00d4aa; padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #1a1b23; border: 1px solid #2a2b35; border-radius: 8px; padding: 16px; }
        .card h2 { color: #a0a0b0; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 8px 6px; color: #666; border-bottom: 1px solid #2a2b35; font-weight: normal; }
        td { padding: 8px 6px; border-bottom: 1px solid #1f2029; }
        .buy { color: #00d4aa; }
        .sell { color: #ff6b6b; }
        .status-complete { color: #00d4aa; }
        .status-rejected { color: #ff6b6b; }
        .status-open { color: #ffd93d; }
        .empty { color: #555; text-align: center; padding: 20px; }
        #last-updated { color: #555; font-size: 12px; margin-top: 10px; text-align: right; }
    </style>
</head>
<body>
    <h1>Trading Bot <span class="mode-badge">PAPER MODE</span></h1>
    <p class="subtitle">Auto-refreshes every 5 seconds</p>

    <div class="grid">
        <div class="card">
            <h2>Recent Trades</h2>
            <div id="trades"><p class="empty">Loading...</p></div>
        </div>
        <div class="card">
            <h2>Open Positions</h2>
            <div id="positions"><p class="empty">Loading...</p></div>
        </div>
        <div class="card" style="grid-column: span 2;">
            <h2>Audit Log</h2>
            <div id="audit"><p class="empty">Loading...</p></div>
        </div>
    </div>
    <div id="last-updated"></div>

    <script>
        async function fetchJSON(url) {
            try {
                const res = await fetch(url);
                return await res.json();
            } catch { return []; }
        }

        function dirClass(d) { return d === 'BUY' ? 'buy' : 'sell'; }
        function statusClass(s) { return 'status-' + (s || '').toLowerCase(); }

        async function refresh() {
            const trades = await fetchJSON('/api/trades');
            const positions = await fetchJSON('/api/positions');
            const audit = await fetchJSON('/api/audit');

            document.getElementById('trades').innerHTML = trades.length ? `
                <table>
                    <tr><th>Time</th><th>Symbol</th><th>Dir</th><th>Qty</th><th>Price</th><th>Fill</th><th>Status</th></tr>
                    ${trades.slice(0, 20).map(t => `
                        <tr>
                            <td>${t.created_at ? new Date(t.created_at).toLocaleTimeString() : '-'}</td>
                            <td>${t.symbol}</td>
                            <td class="${dirClass(t.direction)}">${t.direction}</td>
                            <td>${t.quantity}</td>
                            <td>${t.price}</td>
                            <td>${t.fill_price || '-'}</td>
                            <td class="${statusClass(t.status)}">${t.status}</td>
                        </tr>
                    `).join('')}
                </table>` : '<p class="empty">No trades yet</p>';

            document.getElementById('positions').innerHTML = positions.length ? `
                <table>
                    <tr><th>Symbol</th><th>Dir</th><th>Qty</th><th>Fill Price</th><th>Time</th></tr>
                    ${positions.slice(0, 20).map(p => `
                        <tr>
                            <td>${p.symbol}</td>
                            <td class="${dirClass(p.direction)}">${p.direction}</td>
                            <td>${p.quantity}</td>
                            <td>${p.fill_price || p.price}</td>
                            <td>${p.created_at ? new Date(p.created_at).toLocaleTimeString() : '-'}</td>
                        </tr>
                    `).join('')}
                </table>` : '<p class="empty">No open positions</p>';

            document.getElementById('audit').innerHTML = audit.length ? `
                <table>
                    <tr><th>Time</th><th>Event</th><th>Data</th></tr>
                    ${audit.slice(0, 15).map(a => `
                        <tr>
                            <td>${a.timestamp ? new Date(a.timestamp).toLocaleTimeString() : '-'}</td>
                            <td>${a.event_type}</td>
                            <td style="max-width:500px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.event_data}</td>
                        </tr>
                    `).join('')}
                </table>` : '<p class="empty">No audit events</p>';

            document.getElementById('last-updated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
        }

        refresh();
    </script>
</body>
</html>
